<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>午餐决定器 · 左左专用</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='100%' height='100%' fill='white'/><text x='50%' y='55%' font-family='Arial' font-size='88' text-anchor='middle'>🍚</text></svg>">
<style>
  :root{--fg:#111;--bg:#fff;--muted:#7a7a7a;--accent:#222;}
  @media (prefers-color-scheme: dark){
    :root{--fg:#f2f2f2;--bg:#0b0b0b;--muted:#9a9a9a;--accent:#e6e6e6;}
    body{background:#0b0b0b;}
  }
  html,body{height:100%; margin:0;}
  body{
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:var(--fg); background:var(--bg);
    display:flex; align-items:center; justify-content:center;
  }
  .app{ width:min(680px, 92vw); padding:20px 16px 28px; border-radius:16px; }
  h1{font-size:22px; margin:0 0 8px 0; font-weight:700;}
  .sub{color:var(--muted); font-size:14px; margin-bottom:16px;}
  .card{
    border:1px solid rgba(127,127,127,.2);
    border-radius:16px; padding:16px; text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.06);
  }
  .big{ font-size:36px; line-height:1.2; margin:8px 0 2px; font-weight:800;}
  .muted{color:var(--muted); font-size:14px; margin:0 0 12px;}
  .row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:8px;}
  button{
    appearance:none; border:1px solid rgba(127,127,127,.25);
    background:transparent; color:var(--fg);
    padding:14px 16px; border-radius:12px; font-size:16px; font-weight:700;
    min-width:120px;
  }
  button.primary{
    background:var(--fg); color:var(--bg); border-color:var(--fg);
  }
  button:active{ transform:translateY(1px); }
  .editor{ margin-top:14px; display:none; text-align:left;}
  textarea{
    width:100%; min-height:140px; font-size:15px; padding:12px;
    border-radius:12px; border:1px solid rgba(127,127,127,.25);
    color:var(--fg); background:transparent; resize:vertical;
  }
  .hint{ color:var(--muted); font-size:13px; margin:6px 0 2px; }
  .footer{ color:var(--muted); text-align:center; font-size:12px; margin-top:14px;}
</style>
</head>
<body>
  <div class="app">
    <h1>午餐决定器 · 左左专用</h1>
    <div class="sub">一键告诉你今天吃什么（不想选就不选）。</div>

    <div class="card">
      <div id="result" class="big">还没决定</div>
      <div id="note" class="muted">点下面的大按钮，让命运开口。</div>
      <div class="row">
        <button id="pick" class="primary">一键决定</button>
        <button id="reroll">换一个</button>
        <button id="toggleEdit">编辑清单</button>
        <button id="reset">清空历史</button>
      </div>
      <div class="editor" id="editor">
        <div class="hint">每行一个选项。例子：<code>粥粉面</code>、<code>炸鸡</code>、<code>寿司</code>…</div>
        <textarea id="listBox"></textarea>
        <div class="row" style="justify-content: flex-end;">
          <button id="save">保存</button>
        </div>
      </div>
    </div>

    <div class="footer">
      小技巧：用 Safari 加到主屏幕，变身“App”一键点开就能抽。
    </div>
  </div>

<script>
(function(){
  const DEFAULTS = [
    "粥粉面","炸鸡","寿司","汉堡","沙拉","烧腊","麻辣烫",
    "广式肠粉","云吞面","煲仔饭","炒粉/炒面","牛肉粉","越南粉",
    "披萨","日式拉面","盖浇饭","卤粉/螺蛳粉","麻婆豆腐+米饭",
    "火锅·小份","烤肉拌饭","简餐·便当","酸菜鱼","港式茶餐厅",
    "轻食·三明治","公司食堂","今天不吃午饭（喝点奶茶）"
  ];

  const KEY_ITEMS = "lunch_items_v1";
  const KEY_LAST = "lunch_last_v1";

  const $ = sel => document.querySelector(sel);
  const result = $("#result");
  const note = $("#note");
  const listBox = $("#listBox");
  const editor = $("#editor");

  function loadItems(){
    try {
      const data = JSON.parse(localStorage.getItem(KEY_ITEMS));
      if (Array.isArray(data) && data.length) return data;
    } catch(e){}

    return DEFAULTS.slice();
  }

  function saveItems(arr){
    localStorage.setItem(KEY_ITEMS, JSON.stringify(arr.filter(Boolean)));
  }

  function getLast(){
    return localStorage.getItem(KEY_LAST) || "";
  }
  function setLast(v){
    localStorage.setItem(KEY_LAST, v || "");
  }

  function pickOne(avoid){
    const items = loadItems().filter(Boolean).map(s=>s.trim()).filter(Boolean);
    if (!items.length) return "";
    if (items.length === 1) return items[0];
    let candidate = items[Math.floor(Math.random()*items.length)];
    // avoid immediate repeat
    if (avoid && items.length > 1){
      let tries = 0;
      while(candidate === avoid && tries < 12){
        candidate = items[Math.floor(Math.random()*items.length)];
        tries++;
      }
    }
    return candidate;
  }

  function renderChoice(txt){
    if (!txt){
      result.textContent = "清单是空的";
      note.textContent = "点“编辑清单”添加一些吧。";
      return;
    }
    result.textContent = txt;
    note.textContent = "不喜欢？点“换一个”。";
  }

  // init
  listBox.value = loadItems().join("\n");
  const last = getLast();
  if (last){
    renderChoice(last);
  }

  $("#pick").addEventListener("click", ()=> {
    const choice = pickOne(getLast());
    renderChoice(choice);
    setLast(choice);
  });

  $("#reroll").addEventListener("click", ()=> {
    const choice = pickOne(getLast() || result.textContent);
    renderChoice(choice);
    setLast(choice);
  });

  $("#toggleEdit").addEventListener("click", ()=> {
    editor.style.display = (editor.style.display === "block" ? "none" : "block");
    if (editor.style.display === "block"){
      listBox.value = loadItems().join("\n");
    }
  });

  $("#save").addEventListener("click", ()=> {
    const lines = listBox.value.split(/\n+/).map(s=>s.trim()).filter(Boolean);
    saveItems(lines);
    setLast(""); // clear last to avoid bias with new list
    renderChoice("已保存，重新抽一次试试。");
  });

  $("#reset").addEventListener("click", ()=> {
    setLast("");
    renderChoice("历史已清空，重新来。");
  });

  // Pull-to-pick: small delight - tapping result also picks
  result.addEventListener("click", ()=> {
    const choice = pickOne(getLast());
    renderChoice(choice);
    setLast(choice);
  });
})();
</script>
</body>
</html>
